<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#0A0A0A" />
  <meta name="apple-mobile-web-app-title" content="NEXT AI" />
  <title>NEXT AI // TODAY</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div id="app">

    <!-- Header -->
    <header id="header">
      <div id="header-brand">
        <span class="brand-next">NEXT</span>
        <span class="brand-sep">//</span>
        <span class="brand-today">TODAY</span>
      </div>
      <div id="live-date"></div>
    </header>

    <!-- Story Indicators -->
    <div id="story-indicators" role="progressbar" aria-label="כתבה נוכחית"></div>

    <!-- Cards Container -->
    <div id="cards-container">
      <div id="cards-track"></div>
    </div>

    <!-- Navigation Hints (hidden after first swipe) -->
    <div id="swipe-hint" aria-hidden="true">
      <span>← החלק לכתבה הבאה</span>
    </div>

  </div>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
