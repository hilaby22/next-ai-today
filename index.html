<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NEXT AI // TODAY</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Rubik:wght@300;400;500;700&display=swap" rel="stylesheet">

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <style>
        :root {
            --bg-cyber: #0b0d10;        
            --card-core: #141822;       
            --text-photon: #ffffff;     
            --text-muted: #94a3b8;      
            --accent-electric: #00f5d4; 
            --tag-bg: rgba(0, 245, 212, 0.06); 
            --border-tech: rgba(255, 255, 255, 0.05);
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-cyber);
            font-family: 'Rubik', system-ui, -apple-system, sans-serif;
            color: var(--text-photon);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            overscroll-behavior-y: contain; 
        }

        body::before {
            content: '';
            position: absolute;
            width: 300px;
            height: 300px;
            background: var(--accent-electric);
            filter: blur(150px);
            opacity: 0.04;
            top: 10%;
            left: 10%;
            pointer-events: none;
        }

        .phone-container {
            width: 100%;
            max-width: 412px;
            height: 100%;
            max-height: 850px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 24px;
            box-sizing: border-box;
            position: relative;
            overflow-x: hidden; 
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid var(--border-tech);
        }

        header h1 {
            font-family: 'Inter', sans-serif;
            font-size: 0.95rem;
            font-weight: 600;
            letter-spacing: 2px;
            color: var(--text-photon);
            margin: 0;
        }
        
        header h1 span {
            color: var(--accent-electric);
            text-shadow: 0 0 10px rgba(0, 245, 212, 0.4);
        }

        .header-date {
            font-family: 'Inter', sans-serif;
            font-size: 0.8rem;
            color: var(--text-muted);
            font-weight: 400;
            letter-spacing: 0.5px;
        }

        .card-stack {
            flex-grow: 1;
            position: relative;
            margin: 20px 0;
            height: 560px;
            touch-action: pan-y; 
        }

        .card {
            background-color: var(--card-core);
            border: 1px solid var(--border-tech);
            border-radius: 24px;
            padding: 28px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            transition: transform 0.4s ease-in-out, opacity 0.3s ease-in-out;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }

        .card.active {
            opacity: 1;
            transform: translateX(0);
            pointer-events: auto;
            z-index: 2;
            border-color: rgba(0, 245, 212, 0.15);
        }

        .card.waiting-right {
            transform: translateX(120%);
            opacity: 0;
            z-index: 1;
        }

        .card.waiting-left {
            transform: translateX(-120%);
            opacity: 0;
            z-index: 1;
        }

        .card-meta-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .card-tag {
            background: var(--tag-bg);
            color: var(--accent-electric);
            border: 1px solid rgba(0, 245, 212, 0.2);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 500;
        }

        .source-platform {
            font-size: 0.75rem;
            color: var(--text-muted);
            background: rgba(255, 255, 255, 0.03);
            padding: 4px 10px;
            border-radius: 6px;
            border: 1px solid var(--border-tech);
        }

        .card-title {
            font-size: 1.7rem;
            font-weight: 700;
            color: var(--text-photon);
            margin: 20px 0 12px 0;
            line-height: 1.25;
        }

        .card-description {
            font-size: 0.98rem;
            line-height: 1.6;
            color: var(--text-muted);
            font-weight: 300;
            margin: 0 0 16px 0;
            max-height: 170px;
            overflow-y: auto;
            padding-left: 5px;
        }

        .card-description::-webkit-scrollbar { width: 4px; }
        .card-description::-webkit-scrollbar-track { background: rgba(255, 255, 255, 0.02); border-radius: 4px; }
        .card-description::-webkit-scrollbar-thumb { background: var(--accent-electric); border-radius: 4px; opacity: 0.3; }

        .audience-box {
            background: rgba(0, 0, 0, 0.2);
            border: 1px dashed rgba(148, 163, 184, 0.15);
            border-radius: 12px;
            padding: 12px 16px;
            margin-bottom: 20px;
        }

        .audience-title {
            font-size: 0.75rem;
            color: var(--accent-electric);
            text-transform: uppercase;
            font-weight: 600;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
        }

        .audience-text {
            font-size: 0.85rem;
            color: var(--text-photon);
            margin: 0;
            font-weight: 400;
        }

        .action-btn {
            background-color: var(--text-photon);
            color: var(--bg-cyber);
            text-align: center;
            padding: 16px;
            border-radius: 14px;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.95rem;
            display: block;
            transition: all 0.2s ease;
        }

        .action-btn:hover {
            background-color: var(--accent-electric);
            box-shadow: 0 0 15px rgba(0, 245, 212, 0.4);
        }

        .nav-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 5px 10px 15px 10px;
        }

        .nav-btn {
            background: none;
            border: 1px solid var(--border-tech);
            color: var(--text-muted);
            padding: 12px 24px;
            border-radius: 14px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 500;
            flex: 1;
            max-width: 45%;
        }

        footer {
            text-align: center;
            font-family: 'Inter', sans-serif;
            font-size: 0.68rem;
            color: rgba(148, 163, 184, 0.3);
            letter-spacing: 0.5px;
            padding-bottom: 5px;
            border-top: 1px solid rgba(255, 255, 255, 0.02);
            padding-top: 10px;
        }

        .fallback-message {
            text-align: center;
            color: var(--text-muted);
            font-size: 0.95rem;
        }
    </style>
</head>
<body>

    <div class="phone-container">
        <header>
            <h1>NEXT AI // <span>TODAY</span></h1>
            <div class="header-date" id="live-date">--.--.----</div>
        </header>

        <div class="card-stack" id="stack">
            <div class="fallback-message" id="fallback">טוען נתונים מהירים...</div>
        </div>

        <div class="nav-controls">
            <button class="nav-btn" onclick="changeCard(-1)">חזור</button>
            <button class="nav-btn" onclick="changeCard(1)">הבא</button>
        </div>

        <footer>
           <div>&copy; 2026 NEXT AI // TODAY. All rights reserved.</div>
           <div style="margin-top: 5px; opacity: 0.7; letter-spacing: 1px;">Designed & Automated by Hila B.Y</div>
        </footer>
    </div>

    <script src="data.js"></script>
    <script>
        let currentIdx = 0;
        const stackContainer = document.getElementById('stack');
        const fallback = document.getElementById('fallback');
        const dateContainer = document.getElementById('live-date');

        function setLiveDate() {
            const now = new Date();
            const day = String(now.getDate()).padStart(2, '0');
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const year = now.getFullYear();
            dateContainer.innerText = `${day}.${month}.${year}`;
        }

        // ברגע שהסקריפט רץ, הנתונים כבר שם בטוח. אין צורך בלולאת המתנה איטית
        function initApp() {
            setLiveDate();
            
            if (typeof aiArticles !== 'undefined' && aiArticles.length > 0) {
                renderApp();
            } else {
                fallback.innerText = "שגיאה: לא נמצאו עדכוני חדשות להיום.";
            }
        }

        function renderApp() {
            fallback.style.display = 'none';
            stackContainer.innerHTML = '';
            
            aiArticles.forEach((article, index) => {
                const cardDiv = document.createElement('div');
                cardDiv.className = index === 0 ? 'card active' : 'card waiting-right'; 
                
                cardDiv.innerHTML = `
                    <div>
                        <div class="card-meta-row">
                            <div class="card-tag">${article.type || article.category || 'עדכון טכנולוגי'}</div>
                            <div class="source-platform">${article.source_site || article.source || 'רשת הטכנולוגיה'}</div>
                        </div>
                        <div class="card-title">${article.title || 'ללא כותרת'}</div>
                        <p class="card-description">${article.description || article.summary || ''}</p>
                    </div>
                    <div>
                        <div class="audience-box">
                            <div class="audience-title">קהל יעד ממוקד:</div>
                            <p class="audience-text">${article.audience || 'אנשי טכנולוגיה'}</p>
                        </div>
                        <a href="${article.link || '#'}" target="_blank" class="action-btn">למעבר לאתר הרשמי ↗</a>
                    </div>
                `;
                stackContainer.appendChild(cardDiv);
            });
        }

        function changeCard(direction) {
            const cards = document.querySelectorAll('.card');
            if (cards.length === 0) return;

            const oldCard = cards[currentIdx];
            currentIdx = (currentIdx + direction + cards.length) % cards.length;
            const newCard = cards[currentIdx];

            if (direction === 1) { 
                oldCard.classList.remove('active');
                oldCard.classList.add('waiting-right');
                
                newCard.style.transition = 'none';
                newCard.classList.remove('waiting-right', 'active');
                newCard.classList.add('waiting-left');
                
                void newCard.offsetWidth; 
                
                newCard.style.transition = ''; 
                newCard.classList.remove('waiting-left');
                newCard.classList.add('active');

            } else { 
                oldCard.classList.remove('active');
                oldCard.classList.add('waiting-left');
                
                newCard.style.transition = 'none';
                newCard.classList.remove('waiting-left', 'active');
                newCard.classList.add('waiting-right');
                
                void newCard.offsetWidth; 
                
                newCard.style.transition = '';
                newCard.classList.remove('waiting-right');
                newCard.classList.add('active');
            }
        }

        let touchstartX = 0; let touchstartY = 0; let touchendX = 0; let touchendY = 0;

        stackContainer.addEventListener('touchstart', e => {
            touchstartX = e.changedTouches[0].screenX;
            touchstartY = e.changedTouches[0].screenY;
        }, {passive: true});

        stackContainer.addEventListener('touchend', e => {
            touchendX = e.changedTouches[0].screenX;
            touchendY = e.changedTouches[0].screenY;
            handleSwipe();
        }, {passive: true});

        function handleSwipe() {
            const diffX = touchstartX - touchendX;
            const diffY = touchstartY - touchendY;

            if (Math.abs(diffX) > Math.abs(diffY)) {
                if (diffX < -50) {
                    changeCard(1); 
                } else if (diffX > 50) {
                    changeCard(-1); 
                }
            }
        }

        // קריאה מיידית
        initApp();
    </script>
</body>
</html>
