<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEXT AI // TODAY</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Rubik:wght@300;400;500;700&display=swap');

        :root {
            --bg-cyber: #0b0d10;        /* שחור חלל עמוק */
            --card-core: #141822;       /* כחול-פחם טכנולוגי לכרטיס */
            --text-photon: #ffffff;     /* לבן פוטון בוהק */
            --text-muted: #94a3b8;      /* כסוף פלטינה עמום */
            --accent-electric: #00f5d4; /* טורקיז ניאון חשמלי */
            --tag-bg: rgba(0, 245, 212, 0.06); /* הילה של ניאון */
            --border-tech: rgba(255, 255, 255, 0.05);
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-cyber);
            font-family: 'Rubik', system-ui, -apple-system, sans-serif;
            color: var(--text-photon);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            overscroll-behavior-y: contain; 
        }

        body::before {
            content: '';
            position: absolute;
            width: 300px;
            height: 300px;
            background: var(--accent-electric);
            filter: blur(150px);
            opacity: 0.04;
            top: 10%;
            left: 10%;
            pointer-events: none;
        }

        .phone-container {
            width: 100%;
            max-width: 412px;
            height: 100%;
            max-height: 850px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 24px;
            box-sizing: border-box;
            position: relative;
            overflow-x: hidden; /* מונע כל גלילה אופקית בטעות */
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid var(--border-tech);
        }

        header h1 {
            font-family: 'Inter', sans-serif;
            font-size: 0.95rem;
            font-weight: 600;
            letter-spacing: 2px;
            color: var(--text-photon);
            margin: 0;
        }
        
        header h1 span {
            color: var(--accent-electric);
            text-shadow: 0 0 10px rgba(0, 245, 212, 0.4);
        }

        .header-date {
            font-family: 'Inter', sans-serif;
            font-size: 0.8rem;
            color: var(--text-muted);
            font-weight: 400;
            letter-spacing: 0.5px;
        }

        .card-stack {
            flex-grow: 1;
            position: relative;
            margin: 20px 0;
            height: 560px;
            touch-action: pan-y; 
            /* הפתרון לבאג במובייל: חותך את מה שמחוץ למסגרת */
            overflow: hidden; 
        }

        .card {
            background-color: var(--card-core);
            border: 1px solid var(--border-tech);
            border-radius: 24px;
            padding: 28px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            
            /* עיגון מוחלט כדי למנוע את הבריחה שראינו בצילום המסך */
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            
            pointer-events: none;
            /* מעבר נקי ומהיר יותר בסגנון סטורי */
            transition: transform 0.35s ease-out, opacity 0.3s ease-out;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }

        /* כרטיסייה נוכחית - במרכז ובולטת */
        .card.active {
            opacity: 1;
            transform: translateX(0);
            pointer-events: auto;
            z-index: 2;
            border-color: rgba(0, 245, 212, 0.15);
        }

        /* כרטיסייה קודמת - נדחפת 100% ימינה ומוסתרת לגמרי */
        .card.prev {
            transform: translateX(100%);
            opacity: 0;
            z-index: 1;
        }

        /* כרטיסייה הבאה - נדחפת 100% שמאלה ומוסתרת לגמרי */
        .card.next {
            transform: translateX(-100%);
            opacity: 0;
            z-index: 1;
        }

        .card-meta-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .card-tag {
            background: var(--tag-bg);
            color: var(--accent-electric);
            border: 1px solid rgba(0, 245, 212, 0.2);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 500;
        }

        .source-platform {
            font-size: 0.75rem;
            color: var(--text-muted);
            background: rgba(255, 255, 255, 0.03);
            padding: 4px 10px;
            border-radius: 6px;
            border: 1px solid var(--border-tech);
        }

        .card-title {
            font-size: 1.7rem;
            font-weight: 700;
            color: var(--text-photon);
            margin: 20px 0 12px 0;
            line-height: 1.25;
        }

        .card-description {
            font-size: 0.98rem;
            line-height: 1.6;
            color: var(--text-muted);
            font-weight: 300;
            margin: 0 0 16px 0;
            max-height: 170px;
            overflow-y: auto;
            padding-left: 5px;
        }

        .card-description::-webkit-scrollbar { width: 4px; }
        .card-description::-webkit-scrollbar-track { background: rgba(255, 255, 255, 0.02); border-radius: 4px; }
        .card-description::-webkit-scrollbar-thumb { background: var(--accent-electric); border-radius: 4px; opacity: 0.3; }
        .card-description::-webkit-scrollbar-thumb:hover { opacity: 0.6; }

        .audience-box {
            background: rgba(0, 0, 0, 0.2);
            border: 1px dashed rgba(148, 163, 184, 0.15);
            border-radius: 12px;
            padding: 12px 16px;
            margin-bottom: 20px;
        }

        .audience-title {
            font-size: 0.75rem;
            color: var(--accent-electric);
            text-transform: uppercase;
            font-weight: 600;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
        }

        .audience-text {
            font-size: 0.85rem;
            color: var(--text-photon);
            margin: 0;
            font-weight: 400;
        }

        .action-btn {
            background-color: var(--text-photon);
            color: var(--bg-cyber);
            text-align: center;
            padding: 16px;
            border-radius: 14px;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.95rem;
            display: block;
            transition: all 0.2s ease;
        }

        .action-btn:hover {
            background-color: var(--accent-electric);
            box-shadow: 0 0 15px rgba(0, 245, 212, 0.4);
        }

        .nav-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 5px 10px 15px 10px;
        }

        .nav-btn {
            background: none;
            border: 1px solid var(--border-tech);
            color: var(--text-muted);
            padding: 12px 24px;
            border-radius: 14px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 500;
            transition: all 0.2s;
            flex: 1;
            max-width: 45%;
        }

        .nav-btn:hover {
            color: var(--text-photon);
            border-color: rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.02);
        }

        footer {
            text-align: center;
            font-family: 'Inter', sans-serif;
            font-size: 0.68rem;
            color: rgba(148, 163, 184, 0.3);
            letter-spacing: 0.5px;
            padding-bottom: 5px;
            border-top: 1px solid rgba(255, 255, 255, 0.02);
            padding-top: 10px;
        }

        .fallback-message {
            text-align: center;
            color: var(--text-muted);
            font-size: 0.95rem;
        }
    </style>
</head>
<body>

    <div class="phone-container">
        <header>
            <h1>NEXT AI // <span>TODAY</span></h1>
            <div class="header-date" id="live-date">--.--.----</div>
        </header>

        <div class="card-stack" id="stack">
            <div class="fallback-message" id="fallback">טוען עדכוני מערכת...</div>
        </div>

        <div class="nav-controls">
            <button class="nav-btn" onclick="changeCard(-1)">חזור</button>
            <button class="nav-btn" onclick="changeCard(1)">הבא</button>
        </div>

        <footer>
           <div>&copy; 2026 NEXT AI // TODAY. All rights reserved.</div>
           <div style="margin-top: 5px; opacity: 0.7; letter-spacing: 1px;">Designed & Automated by Hila B.Y</div>
        </footer>
    </div>

    <script src="data.js?v=final"></script>
    <script>
        let currentIdx = 0;
        const stackContainer = document.getElementById('stack');
        const fallback = document.getElementById('fallback');
        const dateContainer = document.getElementById('live-date');

        function setLiveDate() {
            const now = new Date();
            const day = String(now.getDate()).padStart(2, '0');
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const year = now.getFullYear();
            dateContainer.innerText = `${day}.${month}.${year}`;
        }

        function updateCardsState() {
            const cards = document.querySelectorAll('.card');
            if (cards.length === 0) return;

            cards.forEach((card, index) => {
                card.classList.remove('active', 'prev', 'next');

                if (index === currentIdx) {
                    card.classList.add('active'); 
                } else if (index === (currentIdx - 1 + cards.length) % cards.length) {
                    card.classList.add('prev'); 
                } else {
                    card.classList.add('next'); 
                }
            });
        }

        function initApp() {
            setLiveDate();
            
            if (typeof aiArticles === 'undefined' || aiArticles.length === 0) {
                fallback.innerText = "ממתין להזרמת נתונים מקובץ data.js המקומי...";
                return;
            }
            
            fallback.style.display = 'none';
            stackContainer.innerHTML = '';
            
            aiArticles.forEach((article, index) => {
                const cardType = article.type || article.category || article.tag || 'עדכון טכנולוגי';
                const cardSource = article.source_site || article.source || article.site || 'רשת הטכנולוגיה';
                const cardAudience = article.audience || article.target_audience || article.target || 'אנשי טכנולוגיה';
                const cardTitle = article.title || 'ללא כותרת';
                const cardDesc = article.description || article.summary || '';
                const cardLink = article.link || article.url || '#';

                const cardDiv = document.createElement('div');
                cardDiv.className = 'card'; 
                cardDiv.innerHTML = `
                    <div>
                        <div class="card-meta-row">
                            <div class="card-tag">${cardType}</div>
                            <div class="source-platform">${cardSource}</div>
                        </div>
                        <div class="card-title">${cardTitle}</div>
                        <p class="card-description">${cardDesc}</p>
                    </div>
                    <div>
                        <div class="audience-box">
                            <div class="audience-title">קהל יעד ממוקד:</div>
                            <p class="audience-text">${cardAudience}</p>
                        </div>
                        <a href="${cardLink}" target="_blank" class="action-btn">למעבר לאתר הרשמי ↗</a>
                    </div>
                `;
                stackContainer.appendChild(cardDiv);
            });
            
            updateCardsState();
        }

        function changeCard(direction) {
            const cards = document.querySelectorAll('.card');
            if (cards.length === 0) return;

            currentIdx = (currentIdx + direction + cards.length) % cards.length;
            updateCardsState();
        }

        // מנגנון החלקה למובייל
        let touchstartX = 0;
        let touchstartY = 0;
        let touchendX = 0;
        let touchendY = 0;

        stackContainer.addEventListener('touchstart', function(event) {
            touchstartX = event.changedTouches[0].screenX;
            touchstartY = event.changedTouches[0].screenY;
        }, {passive: true});

        stackContainer.addEventListener('touchend', function(event) {
            touchendX = event.changedTouches[0].screenX;
            touchendY = event.changedTouches[0].screenY;
            handleSwipe();
        }, {passive: true});

        function handleSwipe() {
            const diffX = touchstartX - touchendX;
            const diffY = touchstartY - touchendY;

            if (Math.abs(diffX) > Math.abs(diffY)) {
                if (diffX > 50) {
                    changeCard(1); 
                } else if (diffX < -50) {
                    changeCard(-1); 
                }
            }
        }

        initApp();
    </script>
</body>
</html>
